<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            width: 100%;
            height: 100%;
        }

        #main {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("https://mitmeerut.ac.in/media_image/cms_pages/2025_02_06_12_18_15_2008mitmeerut.jpg");



        }

        #form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: burlywood;
            border-radius: 10px;
            width: 50%;
            height: 60%;
        }

        .box {
            width: 200px;
            margin-top: 10px;
            padding: 10px;
        }

        #btn {
            margin-top: 10px;
            padding: 7px;
            width: 100px;
        }

        h2 {
            text-align: center;
        }

        span {
            font-size: 30px;

        }
    </style>
</head>

<body>
    <div id="main">
        <div id="form-container">
            <form id="form">
                <h3><span>Book</span> Event</h3>
                <input type="text" placeholder="Enter Name " required class="book box"><br>
                <input type="number" id="adhar" placeholder="Enter Adhar Number " required class="book box"><br>
                <input type="text" id="phone" placeholder="Enter Phone Number " required class="book box"><br>
                <input type="email" id="email" placeholder="Enter Email " required class="book box"><br>
                <button type="submit" id="btn">Book</button>
            </form>
        </div>
    </div>



    <script>
        let form = document.getElementById("form");
        let nameInput = document.querySelector('input[type="text"]'); // The first text input is name
        let phone = document.getElementById("phone");
        let adhar = document.getElementById("adhar");
        let email = document.getElementById("email");

        // Auto-fill Logic
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (currentUser) {
            nameInput.value = currentUser.name + " " + (currentUser.lname || "");
            email.value = currentUser.email;
            // Make readonly to prevent errors
            nameInput.readOnly = true;
            email.readOnly = true;
        }

        let selectedEvent = JSON.parse(localStorage.getItem("selectedEvent"));
        if (selectedEvent) {
            document.querySelector("h3 span").innerText = `Book ${selectedEvent.name}`;
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            // Validations
            if (phone.value.length !== 10) {
                alert("Phone number must be exactly 10 digits");
                return;
            }

            if (adhar.value.length !== 12) {
                alert("Aadhaar number must be exactly 12 digits");
                return;
            }

            // Processing Booking
            if (!selectedEvent || !currentUser) {
                alert("Session Error: Please re-login or select event again.");
                window.location.href = "std.html";
                return;
            }

            let bookings = JSON.parse(localStorage.getItem("bookings") || "[]");

            // Prevent Duplicates
            let duplicate = bookings.find(b => b.eventId === selectedEvent.id && b.userEmail === currentUser.email);
            if (duplicate) {
                alert("You have already booked this event!");
                window.location.href = "std.html";
                return;
            }

            let newBooking = {
                bookingId: Math.random().toString(36).substring(2, 10).toUpperCase(),
                eventId: selectedEvent.id,
                eventName: selectedEvent.name,
                eventDate: selectedEvent.date,
                userEmail: currentUser.email,
                userName: currentUser.name + " " + (currentUser.lname || ""),
                phone: phone.value,
                adhar: adhar.value,
                timestamp: new Date().toISOString()
            };

            bookings.push(newBooking);
            localStorage.setItem("bookings", JSON.stringify(bookings));

            alert("Booking Successful! Your Booking ID: " + newBooking.bookingId);
            window.location.href = "std.html";
        });
    </script>

    window.location.href="std.html"

    })*/


</body>

</html>
