<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loginpage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        #main {
            width: 100%;
            height: 100%;
            background-image: url("https://mitmeerut.ac.in/media_image/cms_pages/2025_02_06_12_18_15_2008mitmeerut.jpg");

        }

        form {
            width: 500px;
            height: 500px;
            border-radius: 20px;
            background-color: rgba(50, 0, 0, .5);
            margin-left: 350px;
            position: relative;
            top: 10%;

        }

        #login-text {

            position: relative;
            top: 25%;

            left: 30%;


        }

        .box {
            padding: 10px;
            margin: 10px;
            border-radius: 10px;


        }

        #loginlink {
            text-decoration: none;
            font-size: 30px;
            margin-left: 20px;
            color: bisque;
            border: 1px solid black;
            border-radius: 10px;
            background-color: blue;
            padding: 5px;
            position: relative;
            top: 30px;
            cursor: pointer;




        }
    </style>
</head>

<body>
    <section id="main">
        <form id="login-form">

            <div id="login-text">
                <input type="text" placeholder="User Name" required class="box " id="name"><br>
                <input type="email" placeholder="Email" required class="box " id="email"><br>
                <input type="password" placeholder="User password" required class="box " id="password"><br>
                <select class="box optio" id="option">
                    <option value="student"> Student</option>
                    <option value="teacher"> Teacher</option>
                </select> <br>
                <a href="#" id="loginlink"> login</a>
            </div>
        </form>
    </section>
    <script>
        let login = document.getElementById("loginlink")

        login.addEventListener('click', function (e) {
            e.preventDefault();
            let password = document.getElementById("password").value
            let usertype = document.getElementById("option").value
            let email = document.getElementById("email").value

            let userData = JSON.parse(localStorage.getItem("user"))
            let f = false


            for (let i of userData) {
                if (i.email === email && i.password === password && i.usertype === usertype) {
                    f = true
                    if (i.usertype === "student") {
                        localStorage.setItem("currentUser", JSON.stringify(i));
                        window.location.href = "std.html"


                    } else {
                        localStorage.setItem("currentUser", JSON.stringify(i));
                        window.location.href = "teacher.html"


                    }

                    break;


                }
            }
            if (!f) {
                alert("Please Enter Valid Email & Password and usertype")
            }


        })

    </script>
</body>

</html>
