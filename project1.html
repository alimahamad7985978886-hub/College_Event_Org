<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            
        }
        body,html{
            width: 100%;
            height: 100%;
            background-color: rgb(216, 226, 226);
             background-image: url("https://mitmeerut.ac.in/media_image/cms_pages/2025_02_06_12_18_15_2008mitmeerut.jpg");
            
        }
        h1{
            font-size: 50px;
        }
        #main
        {
            text-align: center;
            
            
            
        }
        span{
            color: red;
            font-family: serif;
            font-size: 80px;
        }
        .circle
        {
            font-size: 30px;
            margin: 15px;
            
            width: 150px;
            height: 150px;
            text-align: center;
            position: relative; /* dive ko idhar udhar karne ke liye*/
            top:15%;
            left: 42%;
            border-radius: 50%;
            display: flex;  /*dive ke andar text ko control karne ke liye*/
            align-items: center;
            justify-content: center;
           background: rgba(0, 123, 255, 0.3); /*tranparecy*/
            backdrop-filter: blur(6px); /*ye back blur karta hai*/
          
        }
        .link
        {
            color:#000000;
            text-decoration: none; /*under line ko hatata hai*/
            font-weight: bold;     /*text ko bold karta hai */
        }
        #linklogin
        {
            color:#000000;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <div id="main">
        <h1><span>Welcome</span> To Events<br> Booking website</h1>

    </div>
    <div class="circle register ">
        <a href="register.html"  class="link"> Register</a>
    </div>
    <div class="circle login">
       <a href="login.html"  id="linklogin"> login</a> 
    </div>
</body>
</html>
